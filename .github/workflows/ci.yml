name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Versão do pnpm vem do campo packageManager do package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Persiste o cache local do turbo entre execuções do próprio CI.
      # O cache nunca vem da máquina de quem desenvolve (ver DECISIONS.md).
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # Navegador do e2e com as bibliotecas de sistema que ele precisa no Ubuntu.
      - run: pnpm --filter @tech-challenge/e2e exec playwright install --with-deps chromium

      - run: pnpm quality

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/e2e/playwright-report
          if-no-files-found: ignore
